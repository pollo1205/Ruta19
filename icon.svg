<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="vanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded app icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4" opacity="0.6"/>

  <!-- Route badge circle top right -->
  <circle cx="396" cy="116" r="42" fill="#10b981" filter="url(#shadow)"/>
  <text x="396" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">19</text>

  <!-- Combi / Passenger Van Body -->
  <g filter="url(#shadow)">
    <!-- Main vehicle body -->
    <path d="M120 160 C120 145, 140 135, 175 135 L337 135 C372 135, 392 145, 392 160 L402 290 C402 305, 395 315, 380 315 L132 315 C117 315, 110 305, 110 290 Z" fill="url(#vanGrad)"/>
    
    <!-- Windshield & front windows -->
    <path d="M136 155 L376 155 C382 155, 386 160, 384 168 L374 225 C372 232, 366 237, 358 237 L154 237 C146 237, 140 232, 138 225 L128 168 C126 160, 130 155, 136 155 Z" fill="#1e293b"/>
    <rect x="252" y="155" width="8" height="82" fill="#94a3b8" opacity="0.5"/>
    
    <!-- Route sign banner inside windshield -->
    <rect x="180" y="162" width="152" height="24" rx="6" fill="#0f172a"/>
    <text x="256" y="179" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="1">TENEX</text>

    <!-- Side decorative stripe -->
    <rect x="110" y="258" width="292" height="16" fill="url(#accentGrad)"/>

    <!-- Grille & Headlights -->
    <rect x="190" y="284" width="132" height="20" rx="4" fill="#334155"/>
    <line x1="202" y1="290" x2="310" y2="290" stroke="#64748b" stroke-width="2"/>
    <line x1="202" y1="297" x2="310" y2="297" stroke="#64748b" stroke-width="2"/>

    <!-- Left Headlight -->
    <rect x="124" y="280" width="46" height="24" rx="6" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
    <circle cx="136" cy="292" r="6" fill="#ffffff"/>
    
    <!-- Right Headlight -->
    <rect x="342" y="280" width="46" height="24" rx="6" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
    <circle cx="376" cy="292" r="6" fill="#ffffff"/>

    <!-- Bumper -->
    <rect x="100" y="315" width="312" height="32" rx="10" fill="#334155"/>
    <rect x="206" y="322" width="100" height="18" rx="4" fill="#0f172a"/>
    <text x="256" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">MORELOS</text>

    <!-- Tires / Wheels -->
    <rect x="126" y="347" width="56" height="42" rx="14" fill="#090d16"/>
    <rect x="330" y="347" width="56" height="42" rx="14" fill="#090d16"/>
    <!-- Mirrors -->
    <rect x="92" y="196" width="14" height="32" rx="4" fill="#334155"/>
    <rect x="406" y="196" width="14" height="32" rx="4" fill="#334155"/>
  </g>

  <!-- Bottom Brand Text -->
  <text x="256" y="442" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">CIRCUITO TENEX</text>
  <text x="256" y="472" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#94a3b8" text-anchor="middle">CHECADOR COMUNITARIO</text>
</svg>
